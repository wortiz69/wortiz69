<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jumping Dachshund</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: linear-gradient(160deg, #fdf6ec 0%, #fce8c3 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      overflow: hidden;
    }

    /* ── scene ── */
    .scene {
      position: relative;
      width: 520px;
      height: 380px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* ── ground ── */
    .ground {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 340px;
      height: 18px;
      background: #c9a96e;
      border-radius: 50%;
      opacity: .45;
    }

    /* ── shadow ── */
    .shadow {
      position: absolute;
      bottom: 38px;
      left: 50%;
      transform: translateX(-50%) scaleX(1);
      width: 130px;
      height: 18px;
      background: rgba(100, 60, 10, .25);
      border-radius: 50%;
      animation: shadow-pulse 0.72s cubic-bezier(.36,.07,.19,.97) infinite;
      transform-origin: center center;
    }

    @keyframes shadow-pulse {
      0%   { transform: translateX(-50%) scaleX(1)   scaleY(1);   opacity: .28; }
      45%  { transform: translateX(-50%) scaleX(.45) scaleY(.45); opacity: .10; }
      100% { transform: translateX(-50%) scaleX(1)   scaleY(1);   opacity: .28; }
    }

    /* ── dog wrapper ── */
    .dog-wrap {
      position: absolute;
      bottom: 46px;
      animation: jump 0.72s cubic-bezier(.36,.07,.19,.97) infinite;
    }

    @keyframes jump {
      0%   { transform: translateY(0)     rotate(0deg); }
      20%  { transform: translateY(-4px)  rotate(-3deg); }
      45%  { transform: translateY(-115px) rotate(6deg); }
      70%  { transform: translateY(-8px)  rotate(-2deg); }
      85%  { transform: translateY(0)     rotate(0deg); }
      92%  { transform: translateY(-6px)  rotate(1deg); }
      100% { transform: translateY(0)     rotate(0deg); }
    }

    /* ── tail wag ── */
    .tail {
      animation: wag 0.36s ease-in-out infinite alternate;
      transform-origin: 6px 50%;
    }
    @keyframes wag {
      from { transform: rotate(-20deg); }
      to   { transform: rotate(20deg);  }
    }

    /* ── ear flap during air ── */
    .ear-left  { animation: ear-l 0.72s ease-in-out infinite; transform-origin: 50% 0; }
    .ear-right { animation: ear-r 0.72s ease-in-out infinite; transform-origin: 50% 0; }
    @keyframes ear-l {
      0%,100% { transform: rotate(0deg);   }
      45%     { transform: rotate(-18deg); }
    }
    @keyframes ear-r {
      0%,100% { transform: rotate(0deg);  }
      45%     { transform: rotate(18deg); }
    }

    /* ── leg kick ── */
    .legs { animation: kick 0.72s ease-in-out infinite; transform-origin: 50% 0; }
    @keyframes kick {
      0%,100% { transform: scaleY(1);    }
      45%     { transform: scaleY(.72);  }
    }

    /* ── title ── */
    .title {
      margin-top: 18px;
      font-size: 1.6rem;
      color: #7a4d1d;
      letter-spacing: .08em;
      text-shadow: 0 2px 6px rgba(200,130,40,.18);
      animation: fadein 1s ease both;
    }
    .subtitle {
      margin-top: 6px;
      font-size: .85rem;
      color: #b8895a;
      letter-spacing: .15em;
      text-transform: uppercase;
      animation: fadein 1.4s ease both;
    }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ── sparkles ── */
    .sparkles {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
    }
    .spark {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #f5c842;
      animation: sparkle var(--d, 1.1s) var(--delay, 0s) ease-in-out infinite;
      opacity: 0;
    }
    @keyframes sparkle {
      0%        { opacity: 0;   transform: translate(0,0) scale(.4); }
      30%, 60%  { opacity: 1;   transform: translate(var(--tx,8px), var(--ty,-20px)) scale(1); }
      100%      { opacity: 0;   transform: translate(var(--tx2,12px), var(--ty2,-40px)) scale(.2); }
    }
  </style>
</head>
<body>

<div class="scene">
  <!-- sparkles -->
  <div class="sparkles">
    <div class="spark" style="left:58%; top:30%; --d:1.1s; --delay:.05s; --tx:14px; --ty:-22px; --tx2:20px; --ty2:-44px; background:#f5c842;"></div>
    <div class="spark" style="left:40%; top:25%; --d:1.0s; --delay:.18s; --tx:-12px; --ty:-18px; --tx2:-18px; --ty2:-36px; background:#ff9f5e;"></div>
    <div class="spark" style="left:63%; top:20%; --d:1.2s; --delay:.33s; --tx:10px; --ty:-24px; --tx2:16px; --ty2:-48px; background:#f5c842;"></div>
    <div class="spark" style="left:36%; top:35%; --d:0.9s; --delay:.50s; --tx:-8px;  --ty:-16px; --tx2:-14px; --ty2:-32px; background:#ff9f5e;"></div>
    <div class="spark" style="left:52%; top:18%; --d:1.3s; --delay:.62s; --tx:6px;  --ty:-20px; --tx2:10px;  --ty2:-40px; background:#fff;"></div>
  </div>

  <div class="ground"></div>
  <div class="shadow"></div>

  <div class="dog-wrap">
    <svg viewBox="0 0 180 110" width="180" height="110" xmlns="http://www.w3.org/2000/svg">

      <!-- TAIL -->
      <g class="tail" transform="translate(158,50)">
        <path d="M0,0 Q14,-18 22,-28" stroke="#8B4513" stroke-width="7" stroke-linecap="round" fill="none"/>
        <circle cx="22" cy="-28" r="5" fill="#a0522d"/>
      </g>

      <!-- BODY -->
      <ellipse cx="90" cy="60" rx="68" ry="28" fill="#c8834a"/>
      <!-- belly -->
      <ellipse cx="90" cy="68" rx="44" ry="16" fill="#e8b07a"/>

      <!-- COLLAR -->
      <rect x="62" y="44" width="36" height="9" rx="4" fill="#cc3333"/>
      <circle cx="80" cy="53" r="4" fill="#f5d020"/>

      <!-- HEAD -->
      <ellipse cx="32" cy="50" rx="26" ry="23" fill="#c8834a"/>
      <!-- snout -->
      <ellipse cx="16" cy="58" rx="14" ry="10" fill="#a06030"/>
      <!-- nose -->
      <ellipse cx="10" cy="54" rx="5" ry="4" fill="#2b1400"/>
      <circle cx="9" cy="53" r="1.5" fill="white" opacity=".5"/>
      <!-- mouth -->
      <path d="M10,58 Q14,64 18,58" stroke="#2b1400" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <!-- tongue -->
      <ellipse cx="14" cy="63" rx="4" ry="3" fill="#e84040"/>

      <!-- EYE -->
      <circle cx="26" cy="46" r="6" fill="#1a0a00"/>
      <circle cx="28" cy="44" r="2.2" fill="white"/>
      <circle cx="27" cy="44.5" r="1" fill="#1a0a00"/>

      <!-- EAR LEFT -->
      <g class="ear-left" transform="translate(24,34)">
        <ellipse cx="0" cy="0" rx="11" ry="16" fill="#7a3d0e" transform="rotate(-10)"/>
      </g>
      <!-- EAR RIGHT -->
      <g class="ear-right" transform="translate(44,34)">
        <ellipse cx="0" cy="0" rx="11" ry="16" fill="#7a3d0e" transform="rotate(10)"/>
      </g>

      <!-- LEGS (front + back, four stubs) -->
      <g class="legs">
        <!-- back legs -->
        <rect x="118" y="80" width="14" height="22" rx="7" fill="#b06030"/>
        <rect x="136" y="80" width="14" height="22" rx="7" fill="#b06030"/>
        <!-- front legs -->
        <rect x="46" y="78" width="14" height="22" rx="7" fill="#b06030"/>
        <rect x="64" y="78" width="14" height="22" rx="7" fill="#b06030"/>
        <!-- paw pads -->
        <ellipse cx="125" cy="103" rx="8" ry="4" fill="#8a4020"/>
        <ellipse cx="143" cy="103" rx="8" ry="4" fill="#8a4020"/>
        <ellipse cx="53"  cy="101" rx="8" ry="4" fill="#8a4020"/>
        <ellipse cx="71"  cy="101" rx="8" ry="4" fill="#8a4020"/>
      </g>

    </svg>
  </div>
</div>

<div class="title">Jumping Dachshund!</div>
<div class="subtitle">Boing · Boing · Boing</div>

</body>
</html>
